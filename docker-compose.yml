services:
  # Caddy router pre obe stránky
  caddy:
    build:
      context: .
      dockerfile: Caddy.Dockerfile
    container_name: caddy-router
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"  # Pre HTTP/3 (QUIC)
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - main-network
    depends_on:
      - portfolio-app
      - frontend

  # Portfolio aplikácia
  portfolio-app:
    build:
      context: ./Portfolio
      dockerfile: Dockerfile
      args:
        VITE_EMAILJS_PUBLIC_KEY: ${VITE_EMAILJS_PUBLIC_KEY}
        VITE_EMAILJS_SERVICE_ID: ${VITE_EMAILJS_SERVICE_ID}
        VITE_EMAILJS_TEMPLATE_ID: ${VITE_EMAILJS_TEMPLATE_ID}
    container_name: portfolio-app
    restart: unless-stopped
    networks:
      - main-network

  # Útulňa - Database
  db:
    image: postgres:15-alpine
    container_name: utulna-db
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - main-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Útulňa - Backend
  backend:
    build: ./Útulňa Kráľová Studňa/backend
    container_name: utulna-backend
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: ${DB_HOST}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      DB_PORT: ${DB_PORT}
      SESSION_SECRET: ${SESSION_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL}
      FRONTEND_URL: ${FRONTEND_URL}
    networks:
      - main-network
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3000/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Útulňa - Frontend
  frontend:
    build:
      context: ./Útulňa Kráľová Studňa/frontend
      dockerfile: Dockerfile
    container_name: utulna-frontend
    networks:
      - main-network
    depends_on:
      backend:
        condition: service_healthy

networks:
  main-network:
    driver: bridge

volumes:
  caddy_data:
    # Ukladá SSL certifikáty a kľúče
  caddy_config:
    # Ukladá Caddy konfiguráciu
  postgres_data:
