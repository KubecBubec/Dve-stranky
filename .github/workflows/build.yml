name: Build

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  portfolio:
    name: Portfolio build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Portfolio
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Portfolio/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          VITE_EMAILJS_PUBLIC_KEY: ${{ secrets.VITE_EMAILJS_PUBLIC_KEY }}
          VITE_EMAILJS_SERVICE_ID: ${{ secrets.VITE_EMAILJS_SERVICE_ID }}
          VITE_EMAILJS_TEMPLATE_ID: ${{ secrets.VITE_EMAILJS_TEMPLATE_ID }}
        run: npm run build

  utulna-backend:
    name: Utulna backend check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: "Útulňa Kráľová Studňa/backend"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Syntax check
        run: node --check server.js

  utulna-frontend:
    name: Utulna frontend dependencies
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: "Útulňa Kráľová Studňa/frontend"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: "Útulňa Kráľová Studňa/frontend/package-lock.json"

      - name: Install dependencies
        run: npm ci
