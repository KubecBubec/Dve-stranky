name: Build

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  portfolio:
    name: Portfolio build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Portfolio
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Portfolio/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          VITE_EMAILJS_PUBLIC_KEY: ${{ secrets.VITE_EMAILJS_PUBLIC_KEY }}
          VITE_EMAILJS_SERVICE_ID: ${{ secrets.VITE_EMAILJS_SERVICE_ID }}
          VITE_EMAILJS_TEMPLATE_ID: ${{ secrets.VITE_EMAILJS_TEMPLATE_ID }}
        run: npm run build

  utulna-backend:
    name: Utulna backend check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: "Útulňa Kráľová Studňa/backend"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Syntax check
        run: node --check server.js

  utulna-frontend:
    name: Utulna frontend dependencies
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: "Útulňa Kráľová Studňa/frontend"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: "Útulňa Kráľová Studňa/frontend/package-lock.json"

      - name: Install dependencies
        run: npm ci

  deploy:
    name: Deploy to Linux server
    runs-on: ubuntu-latest
    needs:
      - portfolio
      - utulna-backend
      - utulna-frontend
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run deploy script over SSH
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          REPO_URL: https://github.com/KubecBubec/Dve-stranky.git
          BRANCH: main
        run: |
          set -euo pipefail

          SERVER_HOST="${SERVER_HOST:-130.162.34.199}"
          SERVER_USER="${SERVER_USER:-ubuntu}"
          SERVER_PORT="${SERVER_PORT:-22}"
          SERVER_APP_DIR="/home/ubuntu/stranky"

          if [ -z "${SERVER_SSH_KEY:-}" ]; then
            echo "::error::Missing GitHub secret SERVER_SSH_KEY"
            exit 1
          fi

          echo "Deploy target: ${SERVER_USER}@${SERVER_HOST}:${SERVER_PORT}"

          mkdir -p ~/.ssh
          printf '%s\n' "${SERVER_SSH_KEY}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${SERVER_PORT}" "${SERVER_HOST}" >> ~/.ssh/known_hosts

          ssh -i ~/.ssh/deploy_key -p "${SERVER_PORT}" "${SERVER_USER}@${SERVER_HOST}" \
            "APP_DIR='${SERVER_APP_DIR}' REPO_URL='${REPO_URL}' BRANCH='${BRANCH}' bash -s" < scripts/deploy.sh
